services:
  playwright:
    image: ${PLAYWRIGHT_IMAGE:-mcr.microsoft.com/playwright:v1.65.0-jammy}
    working_dir: /app
    volumes:
      - ../../../:/app
      - ../../../node_modules:/app/node_modules
    network_mode: host
    ipc: host
    entrypoint: /bin/sh -c
    environment:
      - CI=true
      - USE_PREVIEW_SERVER=true
      - BACKEND_PORT=14444
      - FRONTEND_PORT=14300
      - CROUTON_DEV_TOKEN=e2e-dev-token
    command:
      - |
        set -e
        npm install -g pnpm@12.8.1
        pnpm --filter @book-collection/backend exec prisma generate
        pnpm exec playwright test --config=examples/book-collection/e2e/playwright.config.ts
