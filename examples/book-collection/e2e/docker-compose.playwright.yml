x-playwright-base: &playwright-base
  image: mcr.microsoft.com/playwright:v1.64.0-jammy
  working_dir: /app
  volumes:
    - ../../..:/app
    - playwright_node_modules:/app/node_modules
  network_mode: host
  ipc: host
  entrypoint: /bin/sh -c

services:
  playwright:
    <<: *playwright-base
    environment:
      - CI=${CI:-false}
      - USE_PREVIEW_SERVER=true
      - BACKEND_PORT=14444
      - FRONTEND_PORT=14300
    command:
      - |
        corepack enable
        corepack prepare pnpm@12.8.1 --activate
        pnpm install --frozen-lockfile
        pnpm exec prisma generate --schema=examples/book-collection/apps/backend/prisma/schema.prisma
        pnpm exec playwright test --config=examples/book-collection/e2e/playwright.config.ts

  playwright-ui:
    <<: *playwright-base
    environment:
      - CI=false
      - USE_PREVIEW_SERVER=true
      - BACKEND_PORT=14444
      - FRONTEND_PORT=14300
    command:
      - |
        corepack enable
        corepack prepare pnpm@12.8.1 --activate
        pnpm install --frozen-lockfile
        pnpm exec prisma generate --schema=examples/book-collection/apps/backend/prisma/schema.prisma
        pnpm exec playwright test --config=examples/book-collection/e2e/playwright.config.ts --ui --ui-port=8077 --ui-host=localhost

  update-snapshots:
    <<: *playwright-base
    environment:
      - CI=false
      - USE_PREVIEW_SERVER=true
      - BACKEND_PORT=14444
      - FRONTEND_PORT=14300
    command:
      - |
        corepack enable
        corepack prepare pnpm@12.8.1 --activate
        pnpm install --frozen-lockfile
        pnpm exec prisma generate --schema=examples/book-collection/apps/backend/prisma/schema.prisma
        pnpm exec playwright test --config=examples/book-collection/e2e/playwright.config.ts --update-snapshots

volumes:
  playwright_node_modules:
