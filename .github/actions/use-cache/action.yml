name: "Setup"
description: "Load node and NX cache"

runs:
  using: "composite"
  steps:
    - name: Cache node modules
      uses: actions/cache@v5
      with:
        path: node_modules
        key: ${{ env.DEPENDENCIES_CACHE }}-${{ hashFiles('pnpm-lock.yaml') }}
    - name: Cache NX
      uses: actions/cache@v5
      with:
        path: .nx/cache
        key: ${{ runner.os }}-nx-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-nx-
    - uses: pnpm/action-setup@v6
    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: 24
        registry-url: https://registry.npmjs.org/
        scope: "@ghentcdh"
