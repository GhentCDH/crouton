name: 🐞 Bug report
description: Something in crouton doesn't work as expected
labels: ['bug 🐞']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please search [existing issues](https://github.com/GhentCDH/crouton/issues) first.
        **Security problems:** do not file them here — see [SECURITY.md](https://github.com/GhentCDH/crouton/blob/main/SECURITY.md).
  - type: dropdown
    id: packages
    attributes:
      label: Affected package(s)
      multiple: true
      options:
        - crouton-api
        - crouton-core
        - crouton-vue
        - crouton-forms-vue
        - crouton-ui-vue
        - crouton-editor-vue
        - crouton-cli
        - crouton-codegen
        - crouton-prisma
        - crouton-mcp
        - create-crouton
        - add-crouton
        - docs
        - not sure
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `pnpm list "@ghentcdh/*"` (or the package version you use)
      placeholder: 0.0.1-alpha.88
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Minimal steps, ideally against `examples/book-collection` or a fresh `create-crouton` project.
      placeholder: |
        1. Create resource.json (below)
        2. Run `crouton update resources`
        3. Open /authors
        4. See error
    validations:
      required: true
  - type: textarea
    id: resource-json
    attributes:
      label: Minimal resource.json
      description: The smallest `resource.json` (and Prisma model, if relevant) that reproduces the problem.
      render: json
  - type: textarea
    id: logs
    attributes:
      label: Logs / stack trace
      description: Browser console, NestJS output or CLI output.
      render: shell
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Node version, package manager, OS, browser, database.
      placeholder: Node 24, pnpm 10, macOS 15, Chrome 141, PostgreSQL 17
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Screenshots, links, anything else.
