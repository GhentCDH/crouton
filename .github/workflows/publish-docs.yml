name: Publish Docs

on:
  workflow_dispatch:
  push:
    tags:
      - v*.*.*

jobs:
  docs:
    uses: ./.github/workflows/shared-publish-docs.yml
    with:
      docs-base: /crouton
      # Also generate llms.txt / llms-full.txt into the dist dir.
      build-command: npx nx run docs:build-llms
    permissions:
      contents: read
      pages: write
      id-token: write
