name: Publish

# Triggered by the tag that `pnpm release` (nx release --skip-publish) pushes.
# Keep this filename: npm trusted publishing is registered against publish.yml.
on:
  push:
    tags:
      - v*.*.*
  workflow_dispatch:

jobs:
  npm:
    # No `projects` input: the packages are one `fixed` release group, and nx
    # refuses to publish a subset of a fixed group. Everything in
    # nx.json release.projects is published by one command.
    uses: ./.github/workflows/shared-publish-npm.yml
    with:
      # Prereleases must name their dist-tag; drop `--tag alpha` at 1.0.
      publish-args: --access public --verbose --tag alpha
    permissions:
      contents: read
      id-token: write

  release:
    needs: npm
    # Still cut the release when a package failed: the notes list what made it.
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/shared-github-release.yml
    with:
      extra-notes: ${{ needs.npm.outputs.summary }}
    permissions:
      contents: write
