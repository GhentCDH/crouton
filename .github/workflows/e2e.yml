name: E2E

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:
  pull_request:
    types: [labeled, synchronize]

permissions:
  contents: read

env:
  DEPENDENCIES_CACHE: cache-node-modules

jobs:
  e2e:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'run-e2e')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/use-cache
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run E2E tests
        run: pnpm nx run book-collection-e2e:e2e
        env:
          CI: true
      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: examples/book-collection/e2e/playwright-report/
          retention-days: 7
