name: E2E

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:
  pull_request:
    types: [labeled, synchronize]

permissions:
  contents: read

env:
  DEPENDENCIES_CACHE: cache-node-modules

jobs:
  e2e:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'run-e2e')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/use-cache
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('**/pnpm-lock.yaml') }}
      - name: Install Playwright browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
        working-directory: examples/book-collection/e2e
      - name: Install Playwright system deps
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium
        working-directory: examples/book-collection/e2e
      - name: Build workspace packages required by e2e
        run: npx nx run-many -t build --projects=crouton-prisma,crouton-api,crouton-vue --parallel
        env:
          SKIP_DTS: '1'
      - name: Build packages
        run: pnpm nx run-many -t build
      - name: Generate Prisma client
        run: pnpm exec prisma generate --generator client
        working-directory: examples/book-collection/apps/backend
      - name: Run E2E tests
        run: pnpm nx run book-collection-e2e:e2e
        env:
          CI: true
      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: examples/book-collection/e2e/playwright-report/
          retention-days: 7
