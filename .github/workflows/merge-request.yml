name: Build

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

permissions:
  contents: read

env:
  DEPENDENCIES_CACHE: cache-node-modules
  PLAYWRIGHT_IMAGE: mcr.microsoft.com/playwright:v1.64.0-jammy

jobs:
  install-deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/use-cache
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

  build:
    runs-on: ubuntu-latest
    needs: install-deps
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/use-cache
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - uses: nrwl/nx-set-shas@v5
      - run: npx nx run-many -t build -c production --parallel --max-parallel=6
      - name: Verify generated resource.schema.json is up to date
        run: git diff --exit-code -- 'packages/crouton-core/src/lib/resource/resource.schema*.json' docs/.vuepress/public/schema 'docs/guide/2.resources/field-inputs/_generated'

  test:
    runs-on: ubuntu-latest
    needs: install-deps
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/use-cache
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run unit tests with coverage
        run: npx nx run-many -t test --parallel --max-parallel=6

  lint:
    runs-on: ubuntu-latest
    needs: install-deps
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/use-cache
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - run: npx nx run-many -t lint --parallel --max-parallel=6

  e2e:
    runs-on: ubuntu-latest
    needs: install-deps
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/use-cache
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build packages for E2E
        run: pnpm nx run-many --target=build --projects=crouton-prisma,crouton-api,crouton-vue,book-collection-frontend --parallel --max-parallel=4
      - name: Cache Playwright Docker image
        uses: actions/cache@v5
        with:
          path: /tmp/playwright-docker.tar
          key: playwright-docker-${{ env.PLAYWRIGHT_IMAGE }}
      - name: Load or pull Playwright Docker image
        run: |
          if [ -f /tmp/playwright-docker.tar ]; then
            docker load -i /tmp/playwright-docker.tar
          else
            docker pull ${{ env.PLAYWRIGHT_IMAGE }}
            docker save ${{ env.PLAYWRIGHT_IMAGE }} -o /tmp/playwright-docker.tar
          fi
      - name: Run E2E tests
        run: docker compose -f examples/book-collection/e2e/docker-compose.playwright.ci.yml run --rm playwright
      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: examples/book-collection/e2e/playwright-report/
          retention-days: 7

  typecheck:
    runs-on: ubuntu-latest
    needs: install-deps
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/use-cache
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - run: npx nx run-many -t typecheck --parallel --max-parallel=6
