name: Build

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

permissions:
  contents: read

env:
  DEPENDENCIES_CACHE: cache-node-modules
  PLAYWRIGHT_IMAGE: mcr.microsoft.com/playwright:v1.65.0-jammy

jobs:
  ci:
    uses: ./.github/workflows/shared-ci.yml
    with:
      # Report-only for now: knip prints issues but always exits 0.
      # Switch the `knip` script to `knip:strict` once the findings are triaged.
      knip: true
      # Generated resource.schema.json and docs must be committed up to date.
      post-build: >-
        git diff --exit-code --
        'packages/crouton-core/src/lib/resource/resource.schema*.json'
        docs/.vuepress/public/schema
        'docs/guide/2.resources/field-inputs/_generated'

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/use-cache
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build packages for E2E
        run: pnpm nx run-many --target=build --projects=crouton-prisma,crouton-api,crouton-vue,book-collection-frontend --parallel --max-parallel=4
      - name: Cache Playwright Docker image
        uses: actions/cache@v5
        with:
          path: /tmp/playwright-docker.tar
          key: playwright-docker-${{ env.PLAYWRIGHT_IMAGE }}
      - name: Load or pull Playwright Docker image
        run: |
          if [ -f /tmp/playwright-docker.tar ]; then
            docker load -i /tmp/playwright-docker.tar
          else
            docker pull ${{ env.PLAYWRIGHT_IMAGE }}
            docker save ${{ env.PLAYWRIGHT_IMAGE }} -o /tmp/playwright-docker.tar
          fi
      - name: Run E2E tests
        run: docker compose -f examples/book-collection/e2e/docker-compose.playwright.ci.yml run --rm playwright
      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: examples/book-collection/e2e/playwright-report/
          retention-days: 7
