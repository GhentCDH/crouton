name: Build

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

permissions:
  contents: read

env:
  DEPENDENCIES_CACHE: cache-node-modules
  PLAYWRIGHT_IMAGE: mcr.microsoft.com/playwright:v1.65.0-jammy

jobs:
  ci:
    uses: ./.github/workflows/shared-ci.yml
    with:
      knip: true
      # Generated resource.schema.json, docs and agent-docs (built from docs/guide
      # by crouton-core:build-agent-docs) must be committed up to date.
      # `add -N` makes newly generated, uncommitted agent-docs files show in the diff.
      post-build: >-
        git add -N packages/crouton-core/agent-docs &&
        git diff --exit-code --
        'packages/crouton-core/src/lib/resource/resource.schema*.json'
        docs/.vuepress/public/schema
        'docs/guide/2.resources/field-inputs/_generated'
        packages/crouton-core/agent-docs

  duplicate-exports:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Plain Node script, no install needed.
      - run: node tools/check-duplicate-exports.mjs --fail

  # Control renderers in real Chromium (Vitest Browser Mode) + screenshots.
  # Runs in the Playwright image so screenshots match the *-linux references,
  # which are generated in this same image. Keep the tag in sync with PLAYWRIGHT_IMAGE.
  test-browser:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-jammy
      options: --ipc=host
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/use-cache
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run browser tests
        run: pnpm nx run crouton-forms-vue:test-browser
      - name: Coverage summary
        if: always()
        run: |
          node -e '
            const fs = require("fs");
            const file = "packages/crouton-forms-vue/coverage/coverage-summary.json";
            if (!fs.existsSync(file)) process.exit(0);
            const rows = Object.entries(JSON.parse(fs.readFileSync(file, "utf8")))
              .filter(([k]) => k !== "total")
              .map(([k, v]) => `| ${k.split("/controls/")[1] ?? k} | ${v.lines.pct}% | ${v.branches.pct}% |`);
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,
              ["### Control renderer coverage", "| File | Lines | Branches |", "|---|---|---|", ...rows].join("\n") + "\n");
          '
      - name: Upload screenshot diffs
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: browser-test-attachments
          path: packages/crouton-forms-vue/.vitest/attachments/
          retention-days: 7

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/use-cache
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build packages for E2E
        run: pnpm nx run-many --target=build --projects=crouton-prisma,crouton-api,crouton-vue,book-collection-frontend --parallel --max-parallel=4
      - name: Cache Playwright Docker image
        uses: actions/cache@v6
        with:
          path: /tmp/playwright-docker.tar
          key: playwright-docker-${{ env.PLAYWRIGHT_IMAGE }}
      - name: Load or pull Playwright Docker image
        run: |
          if [ -f /tmp/playwright-docker.tar ]; then
            docker load -i /tmp/playwright-docker.tar
          else
            docker pull ${{ env.PLAYWRIGHT_IMAGE }}
            docker save ${{ env.PLAYWRIGHT_IMAGE }} -o /tmp/playwright-docker.tar
          fi
      - name: Run E2E tests
        run: docker compose -f examples/book-collection/e2e/docker-compose.playwright.ci.yml run --rm playwright
      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: examples/book-collection/e2e/playwright-report/
          retention-days: 7
